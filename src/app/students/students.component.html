<div class="container-custom-log" style="margin: 1px; width:100%;">
    <!-- Navbar -->
    <div class="row mb-3 align-items-center position-fixed w-100 bg-white" style="top:0; z-index:1020; padding:10px;">
      <div class="col-sm-4">
        <input class="form-control" type="text" placeholder="Search..." aria-label="Search">
      </div>
      <div class="col-sm-1">
        <button type="button" class="btn btn-primary w-100">Filter 1</button>
      </div>
    </div>

     <!-- Padding for Navbar -->
     <div style="height: 35px;"></div> <!-- Adjust this value based on the height of your navbar -->

<!-- AG Grid Angular Component -->
<ag-grid-angular
   style="width: 100%; height: 500px"
   class="ag-theme-alpine"
   [columnDefs]="columnDefs"
   [rowData]="rowData$ | async"
   [rowSelection]="'multiple'"
   [animateRows]="true"
   (gridReady)="onGridReady($event)"
 ></ag-grid-angular>
