<div class="container-custom-log" style="margin: 1px; width:100%;">
    <!-- Navbar -->
    <div class="row mb-3 align-items-center position-fixed w-100 bg-white" style="top:0; z-index:1020; padding:10px;">
      <div class="col-sm-4">
        <input class="form-control" type="text" placeholder="Search..." aria-label="Search">
      </div>
      <div class="col-sm-1">
        <button type="button" class="btn btn-primary w-100">Filter 1</button>
      </div>
      <div class="col-sm-2">
        <button type="button" class="btn btn-secondary w-100">Filter 2</button>
      </div>
      <div class="col-sm-3">
        <button type="button" class="btn btn-success w-75">Filter 3</button>
      </div>
    </div>

     <!-- Padding for Navbar -->
     <div style="height: 35px;"></div> <!-- Adjust this value based on the height of your navbar -->

    <!-- Table and Buttons -->
    <div class="row">
      <div class="col-sm-8 w-100">
        <div class="table-responsive">
          <table class="table table-striped table-bordered">
            <thead>
              <tr>
                <th scope="col">DateTime</th>
                <th scope="col">Classroom ID</th>
                <th scope="col">Student ID</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of activityLogs">
                <td>{{ item.logTime }}</td>
                <td>{{ item.logLocation }}</td>
                <td>{{ item.studentId }}</td>
              </tr>

    <div class="position-fixed end-0 top-0 mt-5" style="width: 15%;"> <!-- adjust width as needed -->
        <p style="margin-top: 12px">Example Text 1</p>
        <p>Example Text 2</p>

        <button type="button" class="btn btn-primary mb-2" style="margin-top: 220%;">Example Button 1</button>
        <button type="button" class="btn btn-secondary mb-2">Example Button 2</button>
        <p>Example Text 1</p>
        <p>Example Text 2</p>
      </div>
