<div class="container-custom-log" style="margin: 1px; width:100%;">
  <button (click)="toggleRefresh()">
    {{isRefreshing ? 'Stop' : 'Start'}} Refreshing
  </button>


  <ag-grid-angular
  style="width: 100%; height: 870px"
  class="ag-theme-alpine"
  [rowData]="rowData$ | async"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [animateRows]="true"
  (gridReady)="onGridReady($event)"
></ag-grid-angular>
