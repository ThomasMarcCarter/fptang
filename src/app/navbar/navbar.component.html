<div *ngIf="!isLoginPage()" class="d-flex flex-column flex-shrink-0 p-3 bg-light" style="width: 100%; height: 100vh;">
  <a class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-dark text-decoration-none">
    <img src="/assets/images/print.png" width="70%" height="75%" alt="Home" style="margin-left:50%">
  </a>
  <hr>
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a class="nav-link active" aria-current="page" routerLink="/home" routerLinkActive="active">Home</a>
    </li>
    <li>
      <a class="nav-link" routerLink="/classrooms" routerLinkActive="active">Classrooms</a>
    </li>
    <li>
      <a class="nav-link" routerLink="/students" routerLinkActive="active">Students</a>
    </li>
    <li>
      <a class="nav-link" routerLink="/activity-log" routerLinkActive="active">Activity Log</a>
    </li>
  </ul>
  <hr>
  <div class="dropdown">
    <a href="#" class="d-flex align-items-center text-muted text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
      <span *ngIf="authService.isLoggedIn$ | async as isLoggedIn">
        <a class="nav-link" (click)="authService.logout()" *ngIf="isLoggedIn">Logout</a>
      </span>
    </a>
  </div>
</div>
