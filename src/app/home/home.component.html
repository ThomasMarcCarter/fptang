<div class="container-custom" style="margin-left: 15%;">
  <div class="row">
    <div class="col-sm">
      <div class="info-box">
        <h3>Control Unit 1</h3>
        
        <div class="mb-2">
          <P>Current CID: {{currentRoomId}} </P>
          <label for="controlUnit1Input" style="margin-left: 8px">Update CID:</label>
          <input [(ngModel)]="newRoomId" type="text" id="controlUnit1Input" class="form-control" style="width:40px; margin-left: 8px; margin-top: 10px;">
          <button type="button" class="btn btn-primary ms-2" style="margin-top: 10px;" (click)="updateBoxToRoom(1, newRoomId)">Update</button>
        </div>
        
        <div class="d-flex justify-content-end align-items-end">
          <span class="badge bg-success position-relative mb-2">Status: Online <span class="position-absolute top-0 start-0 translate-middle badge border border-light rounded-circle bg-success p-2"></span></span>
        </div>
      </div>
    </div>
  </div>
</div>
